name: Integration Tests

# Runs on a GitHub-hosted windows-latest runner.
# WSL2 runs three containers via Docker daemon:
#   - extension-kit  builder: built artifacts extracted from image
#   - adaptixc2      detached server, --network host, BOF-Collection + profile mounted
#   - testing-kit    runs feature validation + integration tests
# BOFs are compiled in WSL before container startup.
# SSH delivery goes from Docker(WSL) → Windows.
# Beacon callbacks go from Windows → Docker(WSL).

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CI_USER: ci_runner
  CI_PASS: Ci_Test_Pass1!
  CI_AGENT_DIR: 'C:\ci'
  CI_AGENT_PATH: 'C:\ci\agent.exe'
  ADAPTIXC2_IMAGE: ghcr.io/tgjls/adaptixc2:latest
  EXTENSION_KIT_IMAGE: ghcr.io/tgjls/extension-kit:latest
  TESTING_KIT_IMAGE: ghcr.io/tgjls/testing-kit:latest

jobs:
  integration-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pass CI variables into WSL
        shell: powershell
        run: echo "WSLENV=CI_USER/u:CI_PASS/u:CI_AGENT_PATH/u" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── Windows: CI user, OpenSSH, tmp directory ─────────────────────────────
      # C:\ci (agent drop dir) and Defender/firewall config are handled by the
      # SSH preamble after connecting — these steps only do what must exist
      # before SSH is available.

      - name: Create CI user
        shell: powershell
        run: |
          $pass = ConvertTo-SecureString $env:CI_PASS -AsPlainText -Force
          if (-not (Get-LocalUser $env:CI_USER -ErrorAction SilentlyContinue)) {
            New-LocalUser $env:CI_USER -Password $pass -PasswordNeverExpires
            Add-LocalGroupMember -Group Administrators -Member $env:CI_USER
          } else {
            Set-LocalUser $env:CI_USER -Password $pass
          }

      - name: Create tk_test user
        shell: powershell
        run: |
          # Relax local password policy so the hardcoded test credential is accepted
          # on runners with non-default minimum-length or complexity settings.
          $cfgPath = "$env:TEMP\secpol.cfg"
          secedit /export /cfg $cfgPath /quiet
          (Get-Content $cfgPath) `
            -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' `
            -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0' |
            Set-Content $cfgPath
          secedit /configure /db "$env:windir\security\local.sdb" /cfg $cfgPath /areas SECURITYPOLICY /quiet
          Remove-Item $cfgPath -Force -ErrorAction SilentlyContinue
          $pass = ConvertTo-SecureString 'Tk_Test_Pass1!' -AsPlainText -Force
          if (-not (Get-LocalUser tk_test -ErrorAction SilentlyContinue)) {
            New-LocalUser tk_test -Password $pass -PasswordNeverExpires
          } else {
            Set-LocalUser tk_test -Password $pass
          }

      - name: Start OpenSSH Server with password auth
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          if ($cap.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          }
          Set-Service sshd -StartupType Automatic
          Start-Service sshd
          $cfg = "$env:ProgramData\ssh\sshd_config"
          (Get-Content $cfg) `
            -replace '^#?PasswordAuthentication\s+\w+', 'PasswordAuthentication yes' |
            Set-Content $cfg
          Restart-Service sshd

      - name: Create tmp directory for SSH key transfer
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path C:\tmp | Out-Null

      # ── WSL: Ubuntu + Docker + build tools ───────────────────────────────────

      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: >-
            docker.io iproute2 curl
            build-essential
            g++-mingw-w64-x86-64-posix
            gcc-mingw-w64-x86-64-posix
            mingw-w64-tools
            gcc-mingw-w64-i686
            g++-mingw-w64-i686

      - name: Start Docker daemon in WSL
        shell: wsl-bash {0}
        run: |
          sudo update-alternatives --set iptables /usr/sbin/iptables-legacy || true
          sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy || true
          sudo dockerd > /dev/null 2>&1 &
          echo "Waiting for Docker..."
          for i in $(seq 1 30); do
            sudo docker info >/dev/null 2>&1 && { echo "Docker ready."; break; }
            sleep 1
          done
          sudo docker info >/dev/null 2>&1 || { echo "Docker failed to start"; exit 1; }

      # ── WSL: Compile BOFs ─────────────────────────────────────────────────────

      - name: Compile BOFs
        shell: wsl-bash {0}
        run: |
          WIN_WS=$(cmd.exe /c "echo %GITHUB_WORKSPACE%" 2>/dev/null | tr -d '\r')
          WSL_WS=$(wslpath "$WIN_WS")
          make -C "$WSL_WS"
          count=$(find "$WSL_WS" -name '*.x64.o' | wc -l)
          [ "$count" -gt 0 ] || { echo "No .x64.o files produced — build failed silently"; exit 1; }
          echo "✓ BOFs compiled: $count x64 objects"

      # ── WSL: SSH setup ────────────────────────────────────────────────────────

      - name: Generate SSH keypair
        shell: wsl-bash {0}
        run: |
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/ci_key
          cp ~/.ssh/ci_key.pub /mnt/c/tmp/ci_key.pub

      - name: Install SSH public key on Windows
        shell: powershell
        run: |
          $authFile = "$env:ProgramData\ssh\administrators_authorized_keys"
          New-Item -Force -ItemType File -Path $authFile | Out-Null
          Get-Content C:\tmp\ci_key.pub | Add-Content $authFile
          icacls $authFile /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F"

      # ── WSL: CI config ────────────────────────────────────────────────────────

      - name: Write CI config
        shell: wsl-bash {0}
        run: |
          WSL_IP=$(ip route get 1.1.1.1 2>/dev/null | grep -oP 'src \K\S+' | head -1)
          WSL_GW=$(ip route show default 2>/dev/null | awk 'NR==1{print $3}')
          WINDOWS_IP=$(cmd.exe /c ipconfig 2>/dev/null | tr -d '\r' | awk '/vEthernet.*WSL/{f=1} f && /IPv4 Address/{print $NF; exit}')

          if [ -z "$WINDOWS_IP" ] || ip addr show 2>/dev/null | grep -qF "$WINDOWS_IP"; then
            CALLBACK_HOST="127.0.0.1"
            SSH_HOST="127.0.0.1"
            echo "=== WSL2 mirrored mode: WSL_IP=$WSL_IP WINDOWS_IP=${WINDOWS_IP:-none}, using localhost ==="
          else
            CALLBACK_HOST="$WSL_IP"
            SSH_HOST="${WSL_GW:-$WINDOWS_IP}"
            echo "=== WSL2 NAT mode: WSL_IP=$WSL_IP WSL_GW=$WSL_GW WINDOWS_IP=$WINDOWS_IP, SSH→$SSH_HOST ==="
          fi

          KHARON_PROFILE_B64=$(CALLBACK_HOST="$CALLBACK_HOST" python3 << 'PYEOF'
          import json, base64, os
          cb = os.environ["CALLBACK_HOST"]
          profile = {
              "callbacks": [{
                  "hosts": [cb + ":8080"],
                  "user_agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                  "server_error": {
                      "http_status": 403,
                      "response": json.dumps({"status": 403, "error": "Forbidden", "message": "Access denied"}),
                      "headers": {"Content-Type": "application/json; charset=utf-8"}
                  },
                  "get": {
                      "server_headers": {"Content-Type": "text/html; charset=utf-8", "Server": "Apache/2.4.41"},
                      "client_headers": {"Content-Type": "application/json", "Accept": "application/json"},
                      "empty_response": "\\x90\\x90\\x90\\x90\\x90",
                      "uri": {
                          "/route4": {
                              "server_output": {"mask": True, "format": "base64", "cookie": "CK_SRV"},
                              "client_output": {"mask": True, "format": "base64"},
                              "client_parameters": [{"agent_name": "kharon"}, {"maded_by": "oblivion"}]
                          }
                      }
                  },
                  "post": {
                      "server_headers": {"Content-Type": "application/json; charset=utf-8", "Server": "Apache/2.4.41"},
                      "client_headers": {"Content-Type": "application/json", "Accept": "application/json"},
                      "empty_response": "\\x90\\x90\\x90\\x90\\x90",
                      "uri": {
                          "/route1 /route2": {
                              "server_output": {"mask": False, "format": "base64", "header": "MSG_PP", "body": json.dumps({"status": 200, "message": "Success"})},
                              "client_output": {"mask": True, "format": "base64", "prepend": json.dumps({"health": "alive", "message": ""})[:-2], "append": "\"}"}
                          }
                      }
                  }
              }]
          }
          print(base64.b64encode(json.dumps(profile).encode()).decode(), end="")
          PYEOF
          )

          cat > /tmp/ci_config.yaml << EOF
          server:
            url: https://127.0.0.1:4321
            endpoint: /endpoint
          operator:
            name: ci
            password: pass
          setup:
            project: ci
            agent_output: /tmp/ci_agent.exe
            listener:
              name: ci_kharon
              type: KharonHTTP
              config:
                host_bind: "0.0.0.0"
                port_bind: 8080
                ssl: false
                ssl_cert: ""
                ssl_key: ""
                proxy_url: ""
                proxy_user: ""
                proxy_pass: ""
                additional_trusted_hosts: ""
                block_user_agents: ""
                domain_rotation_strategy: "Random"
                trust_x_forwarded_host: false
                uploaded_file: "$KHARON_PROFILE_B64"
            agent:
              agent: kharon
              listener: ci_kharon
              listener_type: KharonHTTP
              config:
                format: Exe
                sleep: "0s"
                jitter: 0
          ssh:
            host: "$SSH_HOST"
            username: "$CI_USER"
            key_path: /root/.ssh/ci_key
            source_path: /tmp/ci_agent.exe
            agent_path: '$CI_AGENT_PATH'
            terminate: true
            preamble:
              - 'New-Item -ItemType Directory -Force -Path C:\ci | Out-Null'
              - 'Set-MpPreference -DisableRealtimeMonitoring \$true'
              - 'Add-MpPreference -ExclusionPath C:\ci'
              - 'New-NetFirewallRule -DisplayName CI_C2_8080 -Direction Inbound -Protocol TCP -LocalPort 8080 -Action Allow -Profile Any | Out-Null'
              - 'if (Test-Path ''C:\Temp\fsbof-test'') { Remove-Item ''C:\Temp\fsbof-test'' -Recurse -Force }'
              - 'New-Item -ItemType Directory -Force -Path ''C:\Temp\fsbof-test'' | Out-Null'
              - 'Set-Content -Path ''C:\Temp\fsbof-test\hello.txt'' -Value ''Hello from fsbof-test'' -Encoding UTF8 -NoNewline'
              - 'Set-Content -Path ''C:\Temp\fsbof-test\source.txt'' -Value ''source content'' -Encoding UTF8 -NoNewline'
              - 'Set-Content -Path ''C:\Temp\fsbof-test\del-target.txt'' -Value ''del target'' -Encoding UTF8 -NoNewline'
              - 'Set-Content -Path ''C:\Temp\fsbof-test\del-unc-target.txt'' -Value ''unc del target'' -Encoding UTF8 -NoNewline'
              - 'Set-Content -Path ''C:\Temp\fsbof-test\file1.log'' -Value ''log entry 1'' -Encoding UTF8 -NoNewline'
              - 'Set-Content -Path ''C:\Temp\fsbof-test\file2.log'' -Value ''log entry 2'' -Encoding UTF8 -NoNewline'
              - 'Set-Content -Path ''C:\Temp\fsbof-test\del1.tmp'' -Value ''del log 1'' -Encoding UTF8 -NoNewline'
              - 'Set-Content -Path ''C:\Temp\fsbof-test\del2.tmp'' -Value ''del log 2'' -Encoding UTF8 -NoNewline'
              - 'New-Item -ItemType Directory -Force -Path ''C:\Temp\fsbof-test\dest'' | Out-Null'
              - 'New-Item -ItemType Directory -Force -Path ''C:\Temp\fsbof-test\moved'' | Out-Null'
              - 'New-Item -ItemType Directory -Force -Path ''C:\Temp\fsbof-test\emptydir'' | Out-Null'
              - 'New-Item -ItemType Directory -Force -Path ''C:\Temp\fsbof-test\rmdir-unc-target'' | Out-Null'
              - 'New-Item -ItemType Directory -Force -Path ''C:\Temp\fsbof-test\rmdir-nonempty-target'' | Out-Null'
              - 'Set-Content -Path ''C:\Temp\fsbof-test\rmdir-nonempty-target\file.txt'' -Value ''keep'' -Encoding UTF8 -NoNewline'
          EOF

      # ── WSL: Pull images ──────────────────────────────────────────────────────

      - name: Pull CI images
        shell: wsl-bash {0}
        run: |
          sudo docker pull ghcr.io/tgjls/adaptixc2:latest
          sudo docker pull ghcr.io/tgjls/extension-kit:latest
          sudo docker pull ghcr.io/tgjls/testing-kit:latest

      # ── WSL: Extract Extension-Kit artifacts ─────────────────────────────────

      - name: Extract Extension-Kit from image
        shell: wsl-bash {0}
        run: |
          CID=$(sudo docker create ghcr.io/tgjls/extension-kit:latest)
          sudo docker cp "$CID":/src /tmp/ext-src
          sudo docker rm "$CID"

      # ── WSL: Prepare BOF-Collection artifacts ────────────────────────────────

      - name: Prepare BOF-Collection artifacts
        shell: wsl-bash {0}
        run: |
          WIN_WS=$(cmd.exe /c "echo %GITHUB_WORKSPACE%" 2>/dev/null | tr -d '\r')
          WSL_WS=$(wslpath "$WIN_WS")

          mkdir -p /tmp/bof-collection/FS-BOF/_bin
          mkdir -p /tmp/bof-collection/Exit-BOF/_bin
          mkdir -p /tmp/bof-collection/TK-BOF/_bin
          mkdir -p /tmp/bof-collection/PS-BOF/_bin
          mkdir -p /tmp/bof-collection/Postex-BOF/_bin

          cp "$WSL_WS/FS-BOF/_bin/"*.o    /tmp/bof-collection/FS-BOF/_bin/
          cp "$WSL_WS/FS-BOF/fs.axs"      /tmp/bof-collection/FS-BOF/
          cp "$WSL_WS/Exit-BOF/_bin/"*.o  /tmp/bof-collection/Exit-BOF/_bin/
          cp "$WSL_WS/Exit-BOF/exit.axs"  /tmp/bof-collection/Exit-BOF/
          cp "$WSL_WS/TK-BOF/_bin/"*.o    /tmp/bof-collection/TK-BOF/_bin/
          cp "$WSL_WS/TK-BOF/tk.axs"      /tmp/bof-collection/TK-BOF/
          cp "$WSL_WS/PS-BOF/_bin/"*.o    /tmp/bof-collection/PS-BOF/_bin/
          cp "$WSL_WS/PS-BOF/ps.axs"      /tmp/bof-collection/PS-BOF/
          cp "$WSL_WS/Postex-BOF/_bin/"*.o   /tmp/bof-collection/Postex-BOF/_bin/
          cp "$WSL_WS/Postex-BOF/postex.axs" /tmp/bof-collection/Postex-BOF/
          cp "$WSL_WS/bof-collection.axs" /tmp/bof-collection/

      # ── WSL: Prepare AdaptixC2 profile ────────────────────────────────────────

      - name: Extract and patch profile.yaml to enable Extension-Kit and BOF-Collection
        shell: wsl-bash {0}
        run: |
          CID=$(sudo docker create ghcr.io/tgjls/adaptixc2:latest)
          sudo docker cp "$CID":/app/profile.yaml /tmp/ci_profile.yaml
          sudo docker rm "$CID"
          # Uncomment the Extension-Kit axscript line
          sed -i 's|#    - "Extension-Kit/extension-kit.axs"|    - "Extension-Kit/extension-kit.axs"|' /tmp/ci_profile.yaml
          # Append BOF-Collection axscript after the Extension-Kit entry
          sed -i '/- "Extension-Kit\/extension-kit.axs"/ a\    - "BOF-Collection/bof-collection.axs"' /tmp/ci_profile.yaml

      # ── WSL: Start AdaptixC2 server ───────────────────────────────────────────

      - name: Start AdaptixC2 server
        shell: wsl-bash {0}
        run: |
          sudo docker run -d --name adaptixc2 \
            --network host \
            -v /tmp/ext-src:/app/Extension-Kit:ro \
            -v /tmp/bof-collection:/app/BOF-Collection:ro \
            -v /tmp/ci_profile.yaml:/app/profile.yaml:ro \
            ghcr.io/tgjls/adaptixc2:latest

          echo "Waiting for AdaptixC2 (port 4321)..."
          for i in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/4321) 2>/dev/null && { echo "Server ready."; break; }
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/4321) 2>/dev/null || {
            echo "=== AdaptixC2 server failed to start within 60s ==="
            sudo docker logs adaptixc2
            exit 1
          }

      # ── WSL: Tests ────────────────────────────────────────────────────────────

      - name: Integration tests
        shell: wsl-bash {0}
        run: |
          WIN_WS=$(cmd.exe /c "echo %GITHUB_WORKSPACE%" 2>/dev/null | tr -d '\r')
          WSL_WS=$(wslpath "$WIN_WS")

          sudo docker run --rm \
            --network host \
            -v "$WSL_WS/.github/ci/tasks.yaml":/tasks.yaml:ro \
            -v /tmp/ci_config.yaml:/tmp/ci_config.yaml:ro \
            -v ~/.ssh/ci_key:/root/.ssh/ci_key:ro \
            ghcr.io/tgjls/testing-kit:latest \
            -c /tmp/ci_config.yaml -t /tasks.yaml

      # ── Cleanup ───────────────────────────────────────────────────────────────

      - name: Print AdaptixC2 server logs
        if: always()
        shell: wsl-bash {0}
        run: sudo docker logs adaptixc2 2>&1 || true

      - name: Teardown
        if: always()
        shell: wsl-bash {0}
        run: |
          sudo docker rm -f adaptixc2 2>/dev/null || true
          rm -f ~/.ssh/ci_key ~/.ssh/ci_key.pub
